# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  # Accounts
  account(id: UUID!): Account
  accounts(filter: String, pagination: PaginationInput, sort: SortInput): AccountConnection!

  # Sites
  site(id: UUID!): Site
  sites(accountId: UUID, filter: String, pagination: PaginationInput, sort: SortInput): SiteConnection!

  # Groups
  group(id: UUID!): Group
  groups(siteId: UUID, filter: String, pagination: PaginationInput): GroupConnection!

  # Agents
  agent(id: UUID!): Agent
  agents(filter: AgentFilterInput, pagination: PaginationInput, sort: SortInput): AgentConnection!
  agentCount(filter: AgentFilterInput): Int!

  # Threats
  threat(id: UUID!): Threat
  threats(filter: ThreatFilterInput, pagination: PaginationInput, sort: SortInput): ThreatConnection!
  threatCount(filter: ThreatFilterInput): Int!

  # Alerts
  alert(id: UUID!): Alert
  alerts(filter: AlertFilterInput, pagination: PaginationInput, sort: SortInput): AlertConnection!

  # Policy
  policy(id: UUID!): Policy
  sitePolicies(siteId: UUID!): Policy
  accountPolicy(accountId: UUID!): Policy

  # Exclusions
  exclusions(type: ExclusionType, siteIds: [UUID!], pagination: PaginationInput): ExclusionConnection!

  # Deep Visibility
  deepVisibilityQuery(id: UUID!): DeepVisibilityQuery
  deepVisibilityEvents(queryId: UUID!, pagination: PaginationInput): [DeepVisibilityEvent!]!

  # Vulnerabilities
  vulnerabilities(filter: VulnerabilityFilterInput, pagination: PaginationInput, sort: SortInput): VulnerabilityConnection!

  # Threat Hunting Rules
  threatHuntingRule(id: UUID!): ThreatHuntingRule
  threatHuntingRules(siteIds: [UUID!], pagination: PaginationInput): ThreatHuntingRuleConnection!

  # Agent Actions
  agentAction(id: UUID!): AgentAction
  agentActions(agentId: UUID!, pagination: PaginationInput): AgentActionConnection!

  # Forensics
  forensicActivities(threatId: UUID!, pagination: PaginationInput): ForensicActivityConnection!

  # Users
  user(id: UUID!): User
  users(accountId: UUID, pagination: PaginationInput): UserConnection!
  currentUser: User

  # Roles
  roles(accountId: UUID): [Role!]!

  # Packages
  agentPackages(osType: OsType, siteId: UUID, pagination: PaginationInput): AgentPackageConnection!

  # Reports
  reports(siteId: UUID, accountId: UUID, pagination: PaginationInput): ReportConnection!

  # Activity Log
  activityLogs(filter: ActivityLogFilterInput, pagination: PaginationInput): ActivityLogConnection!

  # Ranger
  rangerDevices(siteId: UUID!, pagination: PaginationInput): RangerDeviceConnection!

  # Kubernetes Clusters
  kubernetesClusters(accountId: UUID, pagination: PaginationInput): KubernetesClusterConnection!

  # Threat Intelligence
  threatIntelIndicators(type: String, pagination: PaginationInput): ThreatIntelIndicatorConnection!

