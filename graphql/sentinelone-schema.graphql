"""
SentinelOne GraphQL Schema
Conceptual schema derived from the SentinelOne Singularity Platform REST API.
Covers agent management, threat detection, alerts, automated response, forensics,
vulnerability data, deep visibility queries, threat hunting, and security policy management.
"""

# ─── Scalars ───────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar UUID
scalar IPAddress
scalar MacAddress
scalar SHA256
scalar MD5

# ─── Enums ─────────────────────────────────────────────────────────────────────

enum AgentStatus {
  ACTIVE
  INACTIVE
  DISCONNECTED
  DECOMMISSIONED
  UNMANAGED
}

enum ThreatStatus {
  ACTIVE
  MITIGATED
  RESOLVED
  IN_PROGRESS
  BLOCKED
}

enum MitigationStatus {
  MARKED_AS_BENIGN
  MARKED_AS_THREAT
  MITIGATED
  NOT_MITIGATED
  ROLLBACK_FAILED
  ROLLED_BACK
  SUSPICIOUS
  SUSPICIOUS_RESOLVED
}

enum AlertSeverity {
  CRITICAL
  HIGH
  MEDIUM
  LOW
  INFO
}

enum AlertStatus {
  OPEN
  IN_PROGRESS
  CLOSED
  SUPPRESSED
}

enum OsType {
  WINDOWS
  MACOS
  LINUX
  WINDOWS_LEGACY
  ANDROID
  IOS
}

enum InfectedStatus {
  INFECTED
  NOT_INFECTED
  UNKNOWN
}

enum ScanStatus {
  NONE
  STARTED
  ABORTED
  FINISHED
  FAILED
  STARTED_BY_POLICY
}

enum ConfidenceLevel {
  MALICIOUS
  SUSPICIOUS
  PENDING_DISPOSITION
  N_A
}

enum NetworkStatus {
  CONNECTED
  DISCONNECTED
  CONNECTING
  DISCONNECTING
}

enum PolicyMode {
  PROTECT
  DETECT
  OFF
}

enum VulnerabilitySeverity {
  CRITICAL
  HIGH
  MEDIUM
  LOW
  NONE
}

enum SortOrder {
  ASC
  DESC
}

enum ActionType {
  QUARANTINE
  KILL
  REMEDIATE
  ROLLBACK
  DISCONNECT_FROM_NETWORK
  RECONNECT_TO_NETWORK
  INITIATE_SCAN
  ABORT_SCAN
  FETCH_LOGS
}

enum ExclusionType {
  WHITE_USER_CERTIFICATE
  BLACK_HASH
  WHITE_HASH
  WHITE_PATH
  WHITE_PROCESS
  WHITE_CERTIFICATE
  SUPPRESS_DYNAMIC_RULE_ALERT
  SUPPRESS_ALERT
}

enum RuleAction {
  ALERT
  BLOCK
  DETECT
}

enum IncidentStatus {
  UNRESOLVED
  IN_PROGRESS
  RESOLVED
}

# ─── Pagination ────────────────────────────────────────────────────────────────

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalCount: Int!
}

input PaginationInput {
  limit: Int
  cursor: String
  skip: Int
}

input SortInput {
  field: String!
  order: SortOrder!
}

# ─── Account & Site Hierarchy ──────────────────────────────────────────────────

type Account {
  id: UUID!
  name: String!
  state: String
  tier: String
  totalLicenses: Int
  activeLicenses: Int
  expiration: DateTime
  sites: SiteConnection!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AccountConnection {
  nodes: [Account!]!
  pageInfo: PageInfo!
}

type Site {
  id: UUID!
  accountId: UUID!
  account: Account
  name: String!
  state: String
  description: String
  policy: Policy
  agents: AgentConnection!
  totalAgents: Int
  activeAgents: Int
  registrationToken: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SiteConnection {
  nodes: [Site!]!
  pageInfo: PageInfo!
}

type Group {
  id: UUID!
  siteId: UUID!
  site: Site
  name: String!
  type: String
  description: String
  rank: Int
  policy: Policy
  agentCount: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type GroupConnection {
  nodes: [Group!]!
  pageInfo: PageInfo!
}

# ─── Agents ───────────────────────────────────────────────────────────────────

type Agent {
  id: UUID!
  uuid: UUID!
  siteId: UUID!
  site: Site
  groupId: UUID
  group: Group
  computerName: String!
  networkInterfaces: [NetworkInterface!]!
  osType: OsType!
  osName: String
  osVersion: String
  osRevision: String
  agentVersion: String
  status: AgentStatus!
  isActive: Boolean!
  isDecommissioned: Boolean!
  isInfected: InfectedStatus
  isUpToDate: Boolean
  isPendingUninstall: Boolean
  networkStatus: NetworkStatus
  scanStatus: ScanStatus
  lastActiveDate: DateTime
  lastLoggedInUserName: String
  domain: String
  machineType: String
  modelName: String
  cpuId: String
  cpuCount: Int
  memoryCapacity: Int
  encryptedApplications: Boolean
  firewallEnabled: Boolean
  remoteProfilingState: String
  policy: Policy
  threats: ThreatConnection!
  vulnerabilities: VulnerabilityConnection!
  registeredAt: DateTime!
  updatedAt: DateTime!
  externalId: String
  activeThreats: Int
  mitigationMode: String
  scanAbortedAt: DateTime
  scanFinishedAt: DateTime
  scanStartedAt: DateTime
}

type AgentConnection {
  nodes: [Agent!]!
  pageInfo: PageInfo!
}

type NetworkInterface {
  id: UUID
  name: String!
  inet: [IPAddress!]
  inet6: [IPAddress!]
  physical: MacAddress
  gatewayIp: IPAddress
  gatewayMac: MacAddress
}

input AgentFilterInput {
  ids: [UUID!]
  siteIds: [UUID!]
  groupIds: [UUID!]
  accountIds: [UUID!]
  status: AgentStatus
  osType: OsType
  networkStatus: NetworkStatus
  isActive: Boolean
  isDecommissioned: Boolean
  isInfected: Boolean
  computerName: String
  domain: String
  query: String
}

# ─── Threats ──────────────────────────────────────────────────────────────────

type Threat {
  id: UUID!
  agentId: UUID!
  agent: Agent
  siteId: UUID!
  site: Site
  filePath: String
  fileName: String
  fileSize: Int
  fileSha256: SHA256
  fileMd5: MD5
  classification: String
  classificationSource: String
  confidenceLevel: ConfidenceLevel
  status: ThreatStatus!
  mitigationStatus: MitigationStatus
  incidentStatus: IncidentStatus
  analystVerdict: String
  initiatedBy: String
  initiatedByDescription: String
  threatName: String
  publisherName: String
  rebootRequired: Boolean
  rollbackable: Boolean
  containerInfo: ContainerInfo
  cloudFilesHashVerdict: String
  mitigatedPreemptively: Boolean
  engines: [String!]
  indicators: [ThreatIndicator!]
  storyline: String
  browserType: String
  detectedAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ThreatConnection {
  nodes: [Threat!]!
  pageInfo: PageInfo!
}

type ThreatIndicator {
  category: String!
  description: String
  ids: [Int!]
  tactics: [String!]
  techniques: [String!]
}

type ContainerInfo {
  id: UUID
  name: String
  image: String
  labels: JSON
}

input ThreatFilterInput {
  ids: [UUID!]
  agentIds: [UUID!]
  siteIds: [UUID!]
  accountIds: [UUID!]
  status: ThreatStatus
  mitigationStatus: MitigationStatus
  confidenceLevel: ConfidenceLevel
  incidentStatus: IncidentStatus
  fileSha256: SHA256
