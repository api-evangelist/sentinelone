# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # Agent Actions
  disconnectAgentFromNetwork(agentIds: [UUID!]!): BulkActionResult!
  reconnectAgentToNetwork(agentIds: [UUID!]!): BulkActionResult!
  initiateAgentScan(agentIds: [UUID!]!): BulkActionResult!
  abortAgentScan(agentIds: [UUID!]!): BulkActionResult!
  decommissionAgents(agentIds: [UUID!]!): BulkActionResult!
  fetchAgentLogs(agentIds: [UUID!]!): BulkActionResult!
  moveAgentsToGroup(agentIds: [UUID!]!, groupId: UUID!): BulkActionResult!

  # Threat Actions
  mitigateThreat(threatIds: [UUID!]!, action: MitigationStatus!): BulkActionResult!
  markThreatAsResolved(threatIds: [UUID!]!): BulkActionResult!
  markThreatAsBenign(threatIds: [UUID!]!, whiteningOption: String): BulkActionResult!
  rollbackThreats(threatIds: [UUID!]!): BulkActionResult!
  addThreatNote(threatId: UUID!, note: String!): Threat!

  # Alert Actions
  updateAlertStatus(alertIds: [UUID!]!, status: AlertStatus!): BulkActionResult!
  updateAlertAnalystVerdict(alertIds: [UUID!]!, verdict: String!): BulkActionResult!

  # Incident Actions
  createIncident(name: String!, siteId: UUID!, severity: AlertSeverity!): Incident!
  updateIncidentStatus(incidentId: UUID!, status: IncidentStatus!): Incident!
  assignIncident(incidentId: UUID!, userId: UUID!): Incident!
  addAlertToIncident(incidentId: UUID!, alertId: UUID!): Incident!

  # Exclusions
  createExclusion(input: ExclusionCreateInput!): Exclusion!
  deleteExclusions(ids: [UUID!]!): BulkActionResult!

  # Policy
  updateSitePolicy(siteId: UUID!, input: PolicyUpdateInput!): Policy!
  updateGroupPolicy(groupId: UUID!, input: PolicyUpdateInput!): Policy!

  # Threat Hunting Rules
  createThreatHuntingRule(input: ThreatHuntingRuleCreateInput!): ThreatHuntingRule!
  updateThreatHuntingRule(id: UUID!, input: ThreatHuntingRuleCreateInput!): ThreatHuntingRule!
  deleteThreatHuntingRule(id: UUID!): Boolean!
  enableThreatHuntingRule(id: UUID!): ThreatHuntingRule!
  disableThreatHuntingRule(id: UUID!): ThreatHuntingRule!

  # STAR Rules
  createStarRule(input: StarRuleCreateInput!): StarRule!
  updateStarRule(id: UUID!, input: StarRuleCreateInput!): StarRule!
  deleteStarRule(id: UUID!): Boolean!
  enableStarRule(id: UUID!): StarRule!
  disableStarRule(id: UUID!): StarRule!

  # Threat Intelligence
  createThreatIntelIndicator(input: ThreatIntelIndicatorInput!): ThreatIntelIndicator!
  deleteThreatIntelIndicators(ids: [UUID!]!): BulkActionResult!

  # Deep Visibility
  createDeepVisibilityQuery(input: DeepVisibilityQueryInput!): DeepVisibilityQuery!
  cancelDeepVisibilityQuery(id: UUID!): Boolean!

  # Remote Shell
  createRemoteShellSession(agentId: UUID!): RemoteShellSession!
  terminateRemoteShellSession(sessionId: UUID!): Boolean!
  executeRemoteShellCommand(input: RemoteShellCommandInput!): RemoteShellCommandResult!

  # Users
  createUser(input: UserCreateInput!): User!
  deactivateUser(userId: UUID!): User!
  resetUserApiToken(userId: UUID!): User!

  # Groups
  createGroup(siteId: UUID!, name: String!, description: String): Group!
  updateGroup(id: UUID!, name: String, description: String): Group!
  deleteGroup(id: UUID!): Boolean!

  # Sites
  createSite(accountId: UUID!, name: String!, description: String): Site!
  updateSite(id: UUID!, name: String, description: String): Site!
  deleteSite(id: UUID!): Boolean!

  # Reports
  createReport(siteId: UUID!, name: String!, format: String!): Report!
  deleteReport(id: UUID!): Boolean!
}

# ─── Subscriptions ────────────────────────────────────────────────────────────

type Subscription {
  threatDetected(siteIds: [UUID!]): Threat!
  alertCreated(siteIds: [UUID!], severity: AlertSeverity): Alert!
  agentStatusChanged(agentIds: [UUID!]): Agent!
  incidentUpdated(siteIds: [UUID!]): Incident!
}
