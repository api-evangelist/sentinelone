apis:
  - aid: sentinelone:management-api
    name: SentinelOne Management API
    description: >-
      Tenant-scoped REST API for managing agents, threats, alerts, sites,
      accounts, exclusions, policies, and reporting in the SentinelOne
      Singularity Platform. Each customer accesses the API at their own
      management console hostname under /web/api/v2.1 with an ApiToken
      Authorization header issued from console user settings.
    humanURL: https://<tenant>.sentinelone.net/api-doc/overview
