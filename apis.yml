aid: sentinelone
name: SentinelOne
description: >-
  SentinelOne is an AI-driven extended detection and response (XDR) cloud
  security platform delivering autonomous endpoint protection, EDR, identity
  security, cloud workload protection, and threat hunting through its
  Singularity Platform. The Management API exposes the same operations as the
  web console for agents, threats, alerts, sites, accounts, exclusions, and
  policy management. Authentication uses tenant-issued API tokens passed in
  the Authorization header as `ApiToken <token>`.
